<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarayıcı Ayarları</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Page specific overrides */
    body { background-color: var(--bg-color); color: var(--text-color); padding: 0; margin: 0; height: 100vh; overflow: hidden; }
    .settings-layout { display: flex; flex-direction: column; height: 100%; }
    .settings-header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; background: var(--card-bg); }
    .settings-header h2 { margin: 0; font-size: 18px; }
    .settings-content { flex: 1; padding: 24px; overflow-y: auto; }
    .settings-group { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .settings-group h3 { margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; color: var(--accent); font-size: 16px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
    .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
    .actions { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--card-bg); display: flex; justify-content: flex-end; gap: 10px; }
    
    select.full-width {
        width: 100%;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
    }
  </style>
</head>
<body>
  <div class="settings-layout">
    <header class="settings-header">
      <button id="backBtn" class="secondary" style="padding: 8px 12px; min-width: auto;">&larr;</button>
      <h2>Ayarlar</h2>
    </header>

    <div class="settings-content">
      
      <!-- AI Configuration -->
      <div class="settings-group">
        <h3>Yapay Zeka (AI) Yapılandırması</h3>
        <div class="form-group">
          <label for="defaultAiModel">Varsayılan Analiz Modeli</label>
          <select id="defaultAiModel" class="full-width">
            <option value="gpt-4o">GPT-4o (Önerilen)</option>
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Hızlı)</option>
            <option value="claude-3-opus">Claude 3 Opus</option>
          </select>
          <small style="color: #888; display: block; margin-top: 5px;">Analizler için kullanılacak birincil LLM modeli.</small>
        </div>
      </div>

      <!-- Scan Behavior -->
      <div class="settings-group">
        <h3>Tarama Davranışı</h3>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoScan">
            <span>Sayfa yüklendiğinde otomatik analiz öner</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="networkMonitor" checked>
            <span>Ağ trafiğini (XHR/Fetch) izle</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="domMonitor" checked>
            <span>DOM değişikliklerini (Mutations) izle</span>
          </label>
        </div>
      </div>

      <!-- Filters (Existing) -->
      <div class="settings-group">
        <h3>Raporlama Filtreleri</h3>
        <div class="form-group">
          <label>Görüntülenecek Seviyeler</label>
          <div class="checkbox-group" style="flex-direction: row; gap: 20px;">
            <label class="checkbox-label"><input type="checkbox" name="severity" value="high" checked> Yüksek</label>
            <label class="checkbox-label"><input type="checkbox" name="severity" value="medium" checked> Orta</label>
            <label class="checkbox-label"><input type="checkbox" name="severity" value="low" checked> Düşük</label>
          </div>
        </div>
      </div>

    </div>

    <div class="actions">
      <button id="resetSettingsBtn" class="secondary">Varsayılan</button>
      <button id="saveSettingsBtn" class="primary">Kaydet</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
